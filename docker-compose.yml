services:
  ai-api:
    build: ./python
    environment:
      # Container path; override in .env only with another /app/... path.
      DUSNX_CHECKPOINT: ${DUSNX_CHECKPOINT:-/app/artifacts/dusnx_smoke_v2.pt}
      DUSNX_DEVICE: cpu
      PYTHONPATH: /app/src
    volumes:
      - ./artifacts:/app/artifacts:ro
    ports:
      - "8000:8000"

  gateway:
    build: ./gateway-dotnet
    environment:
      AI_API_URL: http://ai-api:8000
      DUSNX_DATA_DIR: /app/data
      ZALO_WEBHOOK_SECRET: ${ZALO_WEBHOOK_SECRET:-change-before-tunnel}
    volumes:
      - ./runtime/gateway-data:/app/data
    depends_on:
      - ai-api
    ports:
      - "8080:8080"

  web:
    image: nginx:alpine
    volumes:
      - ./web-ui:/usr/share/nginx/html:ro
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3000:80"
    depends_on:
      - gateway

  redis:
    image: redis:7-alpine
    profiles: ["infra"]
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports: ["6379:6379"]

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ["infra"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-LocalOnly_DUSNX_ChangeMe123!}
      MSSQL_MEMORY_LIMIT_MB: 2048
    ports: ["1433:1433"]

  minio:
    image: minio/minio:latest
    profiles: ["infra"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dusnx
      MINIO_ROOT_PASSWORD: change-this-password
    ports:
      - "9000:9000"
      - "9001:9001"

  chroma:
    image: chromadb/chroma:latest
    profiles: ["rag"]
    ports:
      - "8001:8000"
    volumes:
      - ./runtime/chroma:/data
