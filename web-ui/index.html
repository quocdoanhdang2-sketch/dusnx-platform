<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DUSN-X Web Demo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="wrap">
    <h1>DUSN-X Cross-Platform Demo</h1>
    <p>Web là nền tảng chính. Dùng cùng một ID logic để thử Web/Zalo/PowerPoint và quan sát state_version tăng.</p>
    <section class="panel">
      <label>Platform
        <select id="platform">
          <option value="web">web</option>
          <option value="zalo">zalo</option>
          <option value="powerpoint">powerpoint</option>
        </select>
      </label>
      <label>Platform user ID <input id="user" value="web-user-001" /></label>
      <label>Linked user key (dùng cùng giá trị giữa Web/Zalo/PowerPoint) <input id="linked" value="global-demo-001" /></label>
      <label>Nội dung <textarea id="content">phân tích DUSN-X và làm tiếp phần hôm trước</textarea></label>
      <label>Feedback của sự kiện trước (-1..1; đã biết trước khi gửi) <input id="feedback" type="number" min="-1" max="1" step="0.1" value="0" /></label>
      <button id="send">Gửi sự kiện</button>
    </section>
    <section class="panel">
      <h2>Kết quả</h2>
      <pre id="output">Chưa có dữ liệu.</pre>
    </section>
    <section class="panel">
      <h2>Presentation Job bất đồng bộ</h2>
      <p>Tạo job PowerPoint và theo dõi trạng thái queued → processing → completed.</p>
      <label>Số slide <input id="slideCount" type="number" min="1" max="20" value="5" /></label>
      <label>Yêu cầu <textarea id="slidePrompt">Tạo slide về kiến trúc DUSN-X cross-platform</textarea></label>
      <button id="generateSlides">Tạo job PowerPoint</button>
      <pre id="jobOutput">Chưa có job.</pre>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
