[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dusnx-platform"
version = "0.2.0"
description = "DUSN-X research MVP: cross-platform dynamic user state network"
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch>=2.3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 120

[tool.setuptools.packages.find]
where = ["src"]
