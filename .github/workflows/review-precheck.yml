name: Read-only LLM review precheck

permissions:
  contents: read

on:
  push:
    paths:
      - scripts/check_llm_v2_review.py
      - scripts/tests/test_llm_v2_review_precheck.py
      - .github/workflows/review-precheck.yml
  pull_request:
    paths:
      - scripts/check_llm_v2_review.py
      - scripts/tests/test_llm_v2_review_precheck.py
      - .github/workflows/review-precheck.yml

jobs:
  synthetic-precheck-harness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check read-only precheck with synthetic fixtures only
        run: python -m unittest discover -s scripts/tests -p test_llm_v2_review_precheck.py -v
