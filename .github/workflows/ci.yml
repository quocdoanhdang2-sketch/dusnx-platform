name: DUSN-X CI

on:
  push:
    branches: [main, develop, "feature/*"]
  pull_request:
    branches: [main, develop]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python project
        run: pip install -e "./python[dev]"
      - name: Run all tests (core + week1 acceptance)
        env:
          PYTHONPATH: "python/src:python/apps:python:."
          DUSNX_DATA_DIR: "/tmp/dusnx-test-data"
        run: pytest python/tests -q --tb=short
      - name: Compile Python files
        run: python -m compileall -q python
      - name: Validate and replay personalization pilot (mock, pipeline only)
        env:
          PYTHONPATH: "python/src:python:."
        run: |
          python python/scripts/evaluate_personalization.py --validate-only
          python python/scripts/evaluate_personalization.py --provider mock --device cpu --output-dir runtime/ci-pilot

  dotnet-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build Gateway
        run: dotnet build gateway-dotnet/Dusnx.Gateway.csproj -c Release
      - name: Run Gateway history tests
        run: dotnet run --project gateway-dotnet.tests/Dusnx.Gateway.Tests.csproj -c Release
      - name: Test local startup health checks
        shell: pwsh
        run: ./scripts/tests/local-health.tests.ps1

  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test safe rendering (XSS prevention, memory cards, chat bubbles)
        run: node --test web-ui/app.test.js
