<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DUSN-X PowerPoint</title><script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>body{font:14px system-ui;padding:14px;color:#172033}label{display:block;font-weight:600;margin-top:10px}input,textarea,select,button{width:100%;box-sizing:border-box;margin:4px 0;padding:9px}button{cursor:pointer}.row{display:flex;gap:8px}.row>*{flex:1}pre{white-space:pre-wrap;word-break:break-word;background:#f4f6fa;padding:8px}.error{color:#b42318}.ok{color:#067647}</style></head>
<body><h1>DUSN-X</h1><p id="status" role="status">Disconnected</p>
<label for="username">Username</label><input id="username" autocomplete="username"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password">
<div class="row"><button id="login">Sign in</button><button id="logout">Sign out</button></div><label for="session">Session</label><select id="session"></select><button id="newSession">New session</button>
<label for="mode">Mode</label><select id="mode"><option value="edit">Edit selected text</option><option value="generate">Generate slides from instruction</option></select>
<div id="countRow" style="display:none"><label for="count">Slides to generate</label><select id="count"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option></select></div>
<div id="targetRow" style="display:none"><label style="font-weight:400;display:flex;gap:8px;align-items:center"><input id="afterSelected" type="checkbox" style="width:auto;margin:0"> Insert after the selected slide (otherwise after the last slide)</label></div>
<label for="language">Response language</label><select id="language"><option value="auto">Auto</option><option value="vi">Tiếng Việt</option><option value="en">English</option></select>
<label for="prompt">Instruction</label><textarea id="prompt" rows="4">Viết lại nội dung Text Box đang chọn, giữ nguyên ý. Chỉ trả về nội dung mới, không kèm giải thích.</textarea><button id="ask">Create proposal from selected text shape</button>
<h2>Proposal</h2><pre id="proposal"></pre><button id="apply" disabled>Apply to original text shape</button><details><summary>Provenance</summary><pre id="provenance"></pre></details>
<script src="taskpane.js"></script></body></html>
